services:
  - type: web
    name: trustgate-review
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn trustgate.demo_app:app --no-proxy-headers --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: PAYPAL_MODE
        value: fake
      - key: COOKIE_SECURE
        value: "1"
      - key: TRUSTED_PROXY_HOPS
        value: "0"
      # Secrets: generated by Render on first deploy, never stored in this repo.
      - key: DEMO_PASSWORD
        sync: false
      - key: ADMIN_KEY
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      # Optional live AI (free tier). Without a key the app uses its scripted stand-ins.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: REPO_URL
        value: https://github.com/lk-nyoka/trustgate
